[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asobibot"
version = "0.2.0"
description = "A Japanese Discord game bot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "discord.py>=2.4,<3",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_bot.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
packages = ["src", "src.cogs"]
